services:
  - type: web
    name: fantasy-football-lineup-assistant
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npm run db:deploy && npm run db:seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fantasy-football-lineup-db
          property: connectionString

databases:
  - name: fantasy-football-lineup-db
    plan: free
    databaseName: fantasy_football_mvp
    user: fantasy_football_mvp
    postgresMajorVersion: "16"
    ipAllowList: []
