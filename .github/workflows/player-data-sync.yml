name: Refresh player data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATA_SYNC_CRON_SECRET: ${{ secrets.DATA_SYNC_CRON_SECRET }}
      PLAYER_DATA_SYNC_URL: ${{ secrets.PLAYER_DATA_SYNC_URL }}

    steps:
      - name: Refresh the live player catalog
        if: ${{ env.DATA_SYNC_CRON_SECRET != '' && env.PLAYER_DATA_SYNC_URL != '' }}
        run: >-
          curl --fail-with-body --retry 2 --retry-all-errors --connect-timeout 20 --max-time 120
          --request POST
          --header "Authorization: Bearer ${DATA_SYNC_CRON_SECRET}"
          "${PLAYER_DATA_SYNC_URL}"
